services:
  web_costandcalc:
    image: mylifenp/web_costandcalc:latest
    build:
      context: ..
      dockerfile: dockers/app_costandcalc.Dockerfile
      args:
        # Baked into the browser bundle at image build time
        NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:8099/graphql}
    container_name: web_costandcalc
    ports:
      - '9081:3000'
    restart: always
    env_file:
      - ./.env
    environment:
      AUTH_URL: https://costandcalc.com
      NODE_ENV: production
      STAGE: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
  admin_costandcalc:
    image: mylifenp/admin_costandcalc:latest
    build:
      context: ..
      dockerfile: dockers/admin_costandcalc.Dockerfile
      args:
        # Baked into the browser bundle at image build time
        NEXT_PUBLIC_GRAPHQL_API_URL: ${NEXT_PUBLIC_GRAPHQL_API_URL:-http://localhost:8099/graphql}
    container_name: admin_costandcalc
    ports:
      - '9082:3000'
    restart: always
    env_file:
      - ./.env
    environment:
      AUTH_URL: https://admin.costandcalc.com
      NODE_ENV: production
      STAGE: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
