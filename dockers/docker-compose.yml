services:
  erp_costandcalc:
    image: mylifenp/brindawan_erp:latest
    container_name: erp_costandcalc
    ports:
      - '9080:3000'
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      STAGE: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
  web_costandcalc:
    image: mylifenp/brindawan_erp:latest
    container_name: web_costandcalc
    ports:
      - '9081:3000'
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      STAGE: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
  admin_costandcalc:
    image: mylifenp/brindawan_erp:latest
    container_name: admin_costandcalc
    ports:
      - '9082:3000'
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      STAGE: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
