[package]
name = "backend_libs_utils"
version = "0.1.0"
edition = "2024"

[dependencies]
nanoid = "0.5"
lettre = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
backend_libs_auth = { workspace = true }


[dependencies.async-graphql]
version = "7.2.1"
features = ["chrono"]

[dependencies.axum]
version = "0.8.9"

[dependencies.tokio]
version = "1.53.1"
features = ["full"]

[dependencies.mongodb]
version = "3"
features = ["bson-3"]

