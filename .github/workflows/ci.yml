name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  DOCKER_IMAGE_ADMIN_COSTANDCALC: mylifenp/admin_costandcalc
  DOCKER_IMAGE_ERP_COSTANDCALC: mylifenp/erp_costandcalc
  DOCKER_IMAGE_WEB_COSTANDCALC: mylifenp/web_costandcalc
  DOCKERHUB_NAMESPACE: mylifenp
  DOCKERHUB_REPOSITORY_ADMIN_COSTANDCALC: admin_costandcalc
  DOCKERHUB_REPOSITORY_ERP_COSTANDCALC: erp_costandcalc
  DOCKERHUB_REPOSITORY_WEB_COSTANDCALC: web_costandcalc

jobs:
  main:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Nx Cloud task distribution (optional)
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Record format check to Nx Cloud
      # - run: npx nx record -- npx nx format:check --base="remotes/origin/main"

      # Run only affected lint/test/build/typecheck/e2e for changed projects
      - name: Affected lint
        run: |
          npx nx affected --target=lint \
            --base=${{ github.event.pull_request.base.sha || github.event.before }} \
            --head=${{ github.sha }} || true

      - name: Affected test
        run: |
          npx nx affected --target=test \
            --base=${{ github.event.pull_request.base.sha || github.event.before }} \
            --head=${{ github.sha }} || true

      - name: Affected build
        run: |
          npx nx affected --target=build \
            --base=${{ github.event.pull_request.base.sha || github.event.before }} \
            --head=${{ github.sha }} || true

      - name: Affected typecheck
        run: |
          npx nx affected --target=typecheck \
            --base=${{ github.event.pull_request.base.sha || github.event.before }} \
            --head=${{ github.sha }} || true

      - name: Affected e2e
        run: |
          npx nx affected --target=e2e \
            --base=${{ github.event.pull_request.base.sha || github.event.before }} \
            --head=${{ github.sha }} || true

      # Nx self-healing helper
      - run: npx nx fix-ci
        if: always()

      # Determine affected projects and expose as job output
      - name: Determine affected projects
        id: affected
        run: |
          # Get JSON array of affected projects
          AFFECTED_JSON=$(npx nx print-affected \
            --base=${{ github.event.pull_request.base.sha || github.event.before }} \
            --head=${{ github.sha }} \
            --select=projects)

          # Convert JSON array to space-separated list
          AFFECTED=$(node -e "const a=JSON.parse(process.argv[1]||'[]'); console.log(a.join(' '))" "$AFFECTED_JSON")

          echo "Affected projects: $AFFECTED"
          echo "affected=$AFFECTED" >> $GITHUB_OUTPUT

      - name: Print affected projects
        run: |
            echo "Affected: ${{ steps.affected.outputs.affected }}"

  build-web-costandcalc:
    runs-on: ubuntu-latest
    needs: main
    if: contains(needs.main.outputs.affected, 'web_costandcalc')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute image version tag
        id: version
        run: |
          base_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.1.0')
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            version_tag="$base_tag"
          else
            version_tag="${base_tag}-build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          fi
          echo "tag=${version_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Web Costandcalc image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/web_costandcalc.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_WEB_COSTANDCALC }}:latest
            ${{ env.DOCKER_IMAGE_WEB_COSTANDCALC }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old Docker Hub image tags (web)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_REPOSITORY: ${{ env.DOCKERHUB_REPOSITORY_WEB_COSTANDCALC }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          token=$(curl -fsSL \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')

          tags_to_delete=$(curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags?page_size=100" | \
            jq -r '.results
              | map(select(.name != "latest"))
              | sort_by(.last_updated)
              | reverse
              | .[5:][]?.name')

          if [ -z "${tags_to_delete}" ]; then
            echo "No old versioned tags to delete"
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "Deleting old Docker Hub tag: ${tag}"
            curl -fsSL \
              -X DELETE \
              -H "Authorization: Bearer ${token}" \
              "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags/${tag}/"
          done <<< "${tags_to_delete}"

  build-admin-costandcalc:
    runs-on: ubuntu-latest
    needs: main
    if: contains(needs.main.outputs.affected, 'admin_costandcalc')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute image version tag
        id: version-admin
        run: |
          base_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.1.0')
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            version_tag="$base_tag"
          else
            version_tag="${base_tag}-build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          fi
          echo "tag=${version_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Admin Costandcalc image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/admin_costandcalc.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_ADMIN_COSTANDCALC }}:latest
            ${{ env.DOCKER_IMAGE_ADMIN_COSTANDCALC }}:${{ steps.version-admin.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prune old Docker Hub image tags (admin)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_REPOSITORY: ${{ env.DOCKERHUB_REPOSITORY_ADMIN_COSTANDCALC }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          token=$(curl -fsSL \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')

          tags_to_delete=$(curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags?page_size=100" | \
            jq -r '.results
              | map(select(.name != "latest"))
              | sort_by(.last_updated)
              | reverse
              | .[5:][]?.name')

          if [ -z "${tags_to_delete}" ]; then
            echo "No old versioned tags to delete"
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "Deleting old Docker Hub tag: ${tag}"
            curl -fsSL \
              -X DELETE \
              -H "Authorization: Bearer ${token}" \
              "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags/${tag}/"
          done <<< "${tags_to_delete}"

  build-erp-costandcalc:
    runs-on: ubuntu-latest
    needs: main
    if: contains(needs.main.outputs.affected, 'erp_costandcalc')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute image version tag
        id: version-erp
        run: |
          base_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.1.0')
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            version_tag="$base_tag"
          else
            version_tag="${base_tag}-build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          fi
          echo "tag=${version_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ERP Costandcalc image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/erp_costandcalc.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_ERP_COSTANDCALC }}:latest
            ${{ env.DOCKER_IMAGE_ERP_COSTANDCALC }}:${{ steps.version-erp.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prune old Docker Hub image tags (erp)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_REPOSITORY: ${{ env.DOCKERHUB_REPOSITORY_ERP_COSTANDCALC }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          token=$(curl -fsSL \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')

          tags_to_delete=$(curl -fsSL \
            -H "Authorization: Bearer ${token}" \
            "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags?page_size=100" | \
            jq -r '.results
              | map(select(.name != "latest"))
              | sort_by(.last_updated)
              | reverse
              | .[5:][]?.name')

          if [ -z "${tags_to_delete}" ]; then
            echo "No old versioned tags to delete"
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "Deleting old Docker Hub tag: ${tag}"
            curl -fsSL \
              -X DELETE \
              -H "Authorization: Bearer ${token}" \
              "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags/${tag}/"
          done <<< "${tags_to_delete}"

  deploy-on-vps:
      needs:
        - build-web-costandcalc
        - build-admin-costandcalc
        - build-erp-costandcalc
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Copy Docker Compose file to server
          run: |
            sudo apt-get update
            sudo apt-get install -y sshpass
            sshpass -p "${{ secrets.PASSPHRASE }}" scp -o StrictHostKeyChecking=no dockers/docker-compose.yml "${{ secrets.VPS_USER }}"@"${{ secrets.VPS_HOST }}":~/costandcalc/

        - name: Deploy to VPS
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            passphrase: ${{ secrets.PASSPHRASE }}
            script: |
              cd ~/costandcalc
              docker compose pull
              docker compose up -d
